<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Wire Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .bg-wire { stroke-dasharray: 8 12; animation: flowWire 20s linear infinite; }
    .pulse-glow { animation: pulseGlow 4s ease-in-out infinite alternate; }
    .orbit-point { animation: orbitMove 12s linear infinite; }
    .node-pulse { animation: nodeBlink 3s ease-in-out infinite alternate; }

    @keyframes flowWire {
      from { stroke-dashoffset: 400; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes nodeBlink {
      0% { r: 4px; opacity: 0.5; }
      100% { r: 7px; opacity: 1; }
    }
  </style>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glowPurple)"/>
  <rect width="1200" height="360" rx="16" fill="url(#glowAmber)"/>

  <!-- Border Outline -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Ambient Grid Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Animated Procedural Graph Nodes in Background (Behind Text) -->
  <g opacity="0.35" filter="url(#neonGlow)">
    <!-- Node Wire 1 -->
    <path d="M 60 80 C 180 80, 160 220, 260 220 C 340 220, 360 120, 480 120" 
          fill="none" stroke="#06b6d4" stroke-width="2.5" class="bg-wire"/>
    <!-- Node Wire 2 -->
    <path d="M 720 240 C 820 240, 840 100, 960 100 C 1040 100, 1080 200, 1140 200" 
          fill="none" stroke="#8b5cf6" stroke-width="2.5" class="bg-wire" style="animation-direction: reverse;"/>
    <!-- Node Wire 3 (Diagonal cross) -->
    <path d="M 220 300 C 380 300, 420 180, 560 180" 
          fill="none" stroke="#3b82f6" stroke-width="2" class="bg-wire"/>
    <path d="M 640 180 C 780 180, 820 300, 980 300" 
          fill="none" stroke="#ec4899" stroke-width="2" class="bg-wire"/>
  </g>

  <!-- Background Decorative Geometric Nodes -->
  <g opacity="0.3">
    <!-- Left Node Box -->
    <rect x="60" y="55" width="100" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="110" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Perlin Noise</text>
    <circle cx="160" cy="80" r="5" fill="#06b6d4" class="node-pulse"/>

    <!-- Left Lower Node Box -->
    <rect x="180" y="275" width="100" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="230" y="305" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Normal Map</text>
    <circle cx="280" cy="300" r="5" fill="#3b82f6" class="node-pulse"/>

    <!-- Right Node Box -->
    <rect x="1040" y="175" width="100" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1090" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">PBR Output</text>
    <circle cx="1040" cy="200" r="5" fill="#8b5cf6" class="node-pulse"/>

    <!-- Right Upper Node Box -->
    <rect x="910" y="75" width="100" height="50" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="960" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" text-anchor="middle">Roughness</text>
    <circle cx="910" cy="100" r="5" fill="#ec4899" class="node-pulse"/>
  </g>

  <!-- Animated Moving Signal Particles -->
  <circle r="4" fill="#67e8f9" filter="url(#neonGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 60 80 C 180 80, 160 220, 260 220 C 340 220, 360 120, 480 120"/>
  </circle>
  <circle r="4" fill="#d8b4fe" filter="url(#neonGlow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 1140 200 C 1080 200, 1040 100, 960 100 C 840 100, 820 240, 720 240"/>
  </circle>
  <circle r="3.5" fill="#f472b6" filter="url(#neonGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 220 300 C 380 300, 420 180, 560 180"/>
  </circle>

  <!-- FOREGROUND CONTENT: Strictly on top and clear of obstructions -->
  <!-- Top Badge Pill -->
  <g transform="translate(600, 68)" filter="url(#subtleShadow)">
    <rect x="-185" y="-17" width="370" height="34" rx="17" fill="#0f172a" stroke="url(#pillGrad)" stroke-width="1.8"/>
    <circle cx="-160" cy="0" r="5" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="5" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
      PROCEDURAL 3D • PBR PIPELINE • SHADERS
    </text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="160" 
        fill="url(#titleGrad)" 
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-0.5" 
        text-anchor="middle" 
        filter="url(#subtleShadow)">
    Parametric 3D Material Authoring
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" 
        fill="#cbd5e1" 
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" 
        font-size="17" 
        font-weight="400" 
        text-anchor="middle"
        filter="url(#subtleShadow)">
    Curated Catalog of Node-Based Procedural Textures, PBR Maps &amp; 3D Texture Painting Software
  </text>

  <!-- Tech Tags Row -->
  <g transform="translate(600, 275)" filter="url(#subtleShadow)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Material Maker</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-215, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="4" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Substance 3D</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(-70, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="4" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">ArmorPaint</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(75, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="4" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Blender Shader</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(220, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">MaterialX</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(365, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="0" y="4" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">Quixel Mixer</text>
    </g>
  </g>
</svg>
